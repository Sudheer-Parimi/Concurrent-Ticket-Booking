spring.application.name=ticket-booking

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/transport?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Psk@MS@21
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Hibernate/JPA settings to automatically create tables based on your Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#razorpay credentials for payments
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
# JWT
security.jwt.secret=${JWT_SECRET:change-this-secret-in-production-to-a-long-random-value}
security.jwt.expiration-seconds=3600

# Actuator / observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
